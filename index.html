<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASO · Sistema de Propostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Identidade ASO: verdes do logo + cinza das engrenagens */
  --brand:#1f7a3a;--brand-dark:#123f22;--accent:#3fae49;--accent-soft:#e8f6ea;
  --ink:#10232a;--muted:#5b6f76;--line:#e3eaec;--bg:#f5f8f9;--card:#fff;
  --warn:#9a5a08;--warn-soft:#fdecd6;--info-soft:#eef2f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;background:var(--brand);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px;text-decoration:none;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.green{background:var(--accent)}
.btn.light{background:#fff;color:var(--brand-dark);border:1.5px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.lg{padding:16px 28px;font-size:16px;border-radius:12px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{font-size:16px;font-weight:800;color:var(--brand-dark);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h3 .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;display:grid;place-items:center}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
.st-criada{background:#eef1f3;color:#4a5a60}
.st-visualizada{background:var(--info-soft);color:var(--brand)}
.st-aprovada{background:var(--accent-soft);color:#137a48}
.st-contrato{background:#ece6fb;color:#5a3ea8}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;padding:10px;border-bottom:2px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;border:1.5px solid var(--line);background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.risk.on{background:var(--warn-soft);border-color:#f0c78a;color:var(--warn)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.2)}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-dark),var(--brand))}
.login .box{background:#fff;border-radius:20px;padding:40px;width:min(400px,92vw);box-shadow:0 30px 60px rgba(0,0,0,.25)}
.login h1{font-size:22px;margin:18px 0 4px;color:var(--brand-dark)}
.login form{display:flex;flex-direction:column;gap:14px;margin-top:24px}

/* ---------- ADMIN ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--brand-dark);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;padding:0 8px 22px}
.logo-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800;flex-shrink:0}
.logo small{display:block;font-weight:500;font-size:11px;opacity:.7}
.side a.nav{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;text-decoration:none;font-weight:600;opacity:.8}
.side a.nav:hover{background:rgba(255,255,255,.07);opacity:1}
.side a.nav.on{background:rgba(255,255,255,.13);opacity:1}
.side .bottom{margin-top:auto;font-size:12px;opacity:.7;padding:8px 12px}
.main{padding:30px 36px 80px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;color:var(--brand-dark)}
.kpi .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.kpi .val{font-size:26px;font-weight:800;color:var(--brand-dark);margin-top:4px}
.build{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.build .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.sticky{position:sticky;top:20px}
.fn-box{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.fn-head{display:grid;grid-template-columns:1fr 110px 36px;gap:10px;margin-bottom:10px}
.fn-box .lbl2{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px}
.it-row{display:grid;grid-template-columns:24px 1fr 90px 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.it-row small{display:block;color:var(--muted);font-size:12px}
.sum-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.sum-line.total{border:none;font-size:18px;font-weight:800;color:var(--brand-dark);padding-top:14px}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{font-size:12px}
.iconbtn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)}
.empty{text-align:center;padding:40px;color:var(--muted)}

/* ---------- PROPOSTA (cliente) ---------- */
.pp header.top{background:var(--brand-dark);color:#fff}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.pp header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px}
.pp .hero{background:linear-gradient(135deg,var(--brand-dark),var(--brand) 60%,#2f9a4a);color:#fff;padding:60px 0 116px;position:relative;overflow:hidden}
.pp .hero:after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(63,174,73,.35),transparent 70%)}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:99px;margin-bottom:20px}
.pp .hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.12;font-weight:800;max-width:780px}
.pp .hero h1 span{color:#b8f5bf}
.pp .lead{margin-top:16px;font-size:17px;opacity:.88;max-width:640px}
.meta{display:flex;flex-wrap:wrap;gap:28px;margin-top:30px;font-size:14px}
.meta b{display:block;font-size:11px;font-weight:600;opacity:.65;text-transform:uppercase;letter-spacing:1px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-70px;position:relative;z-index:2}
.kpis .kpi{background:#fff;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(18,63,34,.08)}
.kpis .sub{font-size:12px;color:var(--muted)}
.pp section{padding:52px 0 4px}
.pp h2{font-size:25px;font-weight:800;color:var(--brand-dark)}
.pp p.sec{color:var(--muted);margin-top:6px;max-width:700px;font-size:15px}
.diag{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-top:22px}
.ai-note{background:var(--accent-soft);border:1px solid #c5ecd6;border-radius:16px;padding:24px;color:#1d4a35;font-size:15px}
.ai-note .tag{font-size:12px;font-weight:800;color:#137a48;text-transform:uppercase;letter-spacing:1px}
.ai-note p{margin-top:10px}
.ai-note ul{margin:12px 0 0 18px}
.ai-note li{margin-bottom:6px}
.risk{display:flex;flex-direction:column;gap:12px}
.risk-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}
.pill.high{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:#137a48}
.ex span{font-size:12px;background:#eef4f5;color:var(--brand-dark);padding:3px 9px;border-radius:6px;font-weight:600;display:inline-block;margin:2px 4px 2px 0}
.fnn{font-weight:700}.fnn small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.items{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.item{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;transition:.2s}
.item.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,174,73,.12)}
.item input{margin-top:3px;width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.item .info{flex:1}.item .info b{font-size:15px}.item .info p{font-size:13px;color:var(--muted);margin-top:2px}
.item .price{font-weight:800;color:var(--brand-dark);white-space:nowrap;text-align:right}
.item .price small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.tg{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.tg.req{color:var(--warn);background:var(--warn-soft)}.tg.rec{color:#137a48;background:var(--accent-soft)}
.invest{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-top:22px}
.pay{background:var(--brand-dark);color:#fff;border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px}
.pay h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.pay .opt{background:rgba(255,255,255,.08);border-radius:12px;padding:14px 16px}
.pay .opt.best{background:var(--accent)}
.pay .opt b{font-size:18px;display:block}.pay .opt small{opacity:.8;font-size:12px}
.pay .monthly{font-size:13px;opacity:.85;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.step b{display:block;margin-top:12px}.step p{font-size:13px;color:var(--muted);margin-top:4px}
.step .when{font-size:12px;font-weight:700;color:var(--accent);margin-top:10px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.why div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.why .big{font-size:28px;font-weight:800;color:var(--brand)}.why p{color:var(--muted);margin-top:4px}
.cta{margin:60px 0 0;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border-radius:24px;padding:44px;display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.cta h2{color:#fff}.cta p{opacity:.85;margin-top:8px;max-width:520px}
.approved{background:var(--accent-soft);border:1.5px solid #9fdcbc;color:#137a48;border-radius:16px;padding:22px 26px;font-weight:700;margin-top:24px;font-size:15px}
.pp footer{padding:40px 0;font-size:12px;color:var(--muted);text-align:center}
.demo-bar{background:#fff7e6;color:#8a5a00;text-align:center;font-size:12px;padding:8px;font-weight:600}

/* ---------- CONTRATO ---------- */
.ct-bar{position:sticky;top:0;background:var(--brand-dark);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.paper{background:#fff;width:210mm;max-width:100%;margin:28px auto;padding:22mm 20mm;box-shadow:0 10px 40px rgba(0,0,0,.08);font-size:13px;line-height:1.65;color:#1b2b30}
.paper .ct-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:22px}
.paper h1{font-size:17px;text-align:center;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;color:var(--brand-dark)}
.paper .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:22px}
.paper h4{font-size:13px;text-transform:uppercase;margin:18px 0 6px;color:var(--brand-dark)}
.paper p{margin-bottom:8px;text-align:justify}
.paper table{font-size:12px;margin:8px 0 12px}
.paper td,.paper th{padding:7px 8px}
.paper .parts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:6px}
.paper .parts div{background:#f5f8f9;border-radius:8px;padding:12px;font-size:12px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:60px;text-align:center;font-size:12px}
.sign div{border-top:1px solid #333;padding-top:8px}
.paper .note{font-size:11px;color:var(--muted);margin-top:30px;border-top:1px dashed var(--line);padding-top:10px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}
  .side .bottom,.side .logo-img{display:none}.main{padding:20px}
  .build,.diag,.invest{grid-template-columns:1fr}
  .grid2,.grid3,.grid4,.kpis,.timeline{grid-template-columns:1fr 1fr}
  .why{grid-template-columns:1fr}.tscroll{overflow-x:auto}.tscroll table{min-width:620px}
}
@media print{
  .no-print,.ct-bar,.btn,.demo-bar{display:none!important}
  body{background:#fff}
  .paper{box-shadow:none;margin:0;padding:0;width:auto}
  @page{size:A4;margin:18mm}
}
.logo-img{display:block;background:#fff;border-radius:12px;padding:8px 12px}
.logo-img img{display:block;height:44px;width:auto}
.side .logo-img{margin:0 6px 22px}
.side .logo-img img{height:40px;margin:0 auto}
.login .logo-img{padding:0}.login .logo-img img{height:64px}
.pp header.top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.paper .logo-img{padding:0}.paper .logo-img img{height:52px}
</style>
</head>

function novoDraft(d,empresaId){
  const itens={};
  d.servicos.forEach(s=>itens[s.id]={on:!!s.obrig,qtd:1});
  return {id:uid(),num:'',empresaId,funcoes:[{nome:'',qtd:1,riscos:[],exames:['clinico']}],itens,desconto:0,validade:30,
    pagamento:'À vista (PIX) com 5% de desconto ou em 3x no boleto',esocial:true,obs:'',status:'criada',criada:hoje()};
}
function syncTreinos(p,d=db,ligar=false){
  RISCOS.filter(r=>r.treino).forEach(r=>{
    const q=p.funcoes.filter(f=>f.riscos.includes(r.id)).reduce((s,f)=>s+(+f.qtd||0),0);
    const it=p.itens[r.treino];
    if(q>0){it.qtd=q;if(ligar)it.on=true}else{it.qtd=0;it.on=false}
  });
}
const getEmp=id=>db.empresas.find(e=>e.id===id);
const getProp=id=>db.propostas.find(p=>p.id===id);
const exPreco=id=>(db.exames.find(e=>e.id===id)||{}).valor||0;
const exNome=id=>(db.exames.find(e=>e.id===id)||{}).nome||id;

function calc(p,itensOverride){
  const itensSel=itensOverride||p.itens;
  const linhas=p.funcoes.filter(f=>f.nome||f.qtd).map(f=>{const unit=f.exames.reduce((s,e)=>s+exPreco(e),0);return{...f,unit,sub:unit*(+f.qtd||0)}});
  const exames=linhas.reduce((s,l)=>s+l.sub,0);
  const itens=db.servicos.filter(s=>itensSel[s.id]&&itensSel[s.id].on).map(s=>{const q=s.un==='pessoa'?(+itensSel[s.id].qtd||0):1;return{...s,qtd:q,total:s.valor*q}});
  const g=k=>itens.filter(i=>i.grupo===k).reduce((s,i)=>s+i.total,0);
  const docs=g('docs'),train=g('train'),mobile=g('mobile');
  const subtotal=exames+docs+train+mobile;
  const desc=subtotal*(+p.desconto||0)/100;
  const total=subtotal-desc;
  const pessoas=linhas.reduce((s,l)=>s+(+l.qtd||0),0);
  const nExames=linhas.reduce((s,l)=>s+l.exames.length*(+l.qtd||0),0);
  return{linhas,exames,itens,docs,train,mobile,subtotal,desc,total,pessoas,nExames,mensal:p.esocial?db.esocialMensal:0};
}
/* O link do cliente carrega a proposta dentro dele (funciona em qualquer celular, sem banco de dados).
   Na versão com banco, vira só /p/<id>. */
function b64e(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function snapshot(p){
  const e=getEmp(p.empresaId)||{};
  const usados=[...new Set(p.funcoes.flatMap(f=>f.exames))];
  const px={};usados.forEach(id=>{const x=db.exames.find(y=>y.id===id);if(x)px[id]=[x.nome,x.valor]});
  const ps={};db.servicos.forEach(s=>ps[s.id]=s.valor);
  const i={};Object.entries(p.itens).forEach(([k,v])=>i[k]=[v.on?1:0,v.qtd]);
  return{v:1,p:{id:p.id,n:p.num,c:p.criada,va:p.validade,d:p.desconto,pg:p.pagamento,es:p.esocial?1:0,o:p.obs,f:p.funcoes.map(f=>[f.nome,f.qtd,f.riscos,f.exames]),i},
    e:{r:e.razao,f:e.fantasia,cn:e.cnpj,ca:e.cnae,cd:e.cnaeDesc,g:e.grau,ct:e.contato,cg:e.cargo,ci:e.cidade,uf:e.uf,en:e.endereco},px,ps,m:db.esocialMensal,w:db.config.whats};
}
const linkProp=p=>location.href.split('#')[0].split('?')[0]+'#/v/'+b64e(JSON.stringify(snapshot(p)));
function abrirSnapshot(data){
  let s;try{s=JSON.parse(b64d(data))}catch(err){app.innerHTML='<div class="empty" style="padding:100px">Link inválido.</div>';return}
  if(!getProp(s.p.id)){ // celular do cliente: monta a proposta a partir do link
    const e=s.e,eid='x'+s.p.id;
    db.empresas.push({id:eid,razao:e.r,fantasia:e.f,cnpj:e.cn,cnae:e.ca,cnaeDesc:e.cd,grau:e.g,contato:e.ct,cargo:e.cg,cidade:e.ci,uf:e.uf,endereco:e.en});
    Object.entries(s.px).forEach(([id,[nome,valor]])=>{const x=db.exames.find(y=>y.id===id);if(x)x.valor=valor;else db.exames.push({id,nome,valor})});
    db.servicos.forEach(sv=>{if(s.ps[sv.id]!==undefined)sv.valor=s.ps[sv.id]});
    db.esocialMensal=s.m;db.config.whats=s.w;
    const itens={};Object.entries(s.p.i).forEach(([k,[on,q]])=>itens[k]={on:!!on,qtd:q});
    db.propostas.push({id:s.p.id,num:s.p.n,empresaId:eid,criada:s.p.c,validade:s.p.va,desconto:s.p.d,pagamento:s.p.pg,esocial:!!s.p.es,obs:s.p.o,
      funcoes:s.p.f.map(([nome,qtd,riscos,exames])=>({nome,qtd,riscos,exames})),itens,status:'visualizada'});
    save();
  }
  viewProposta(s.p.id);
}

function route(){
  const h=location.hash.replace('#','')||'/dash';
  const [_,r,a]=h.split('/');
  window.scrollTo(0,0);
  if(r==='p')return viewProposta(a);
  if(r==='v')return abrirSnapshot(a);
  if(r==='contrato')return viewContrato(a);
  if(!db.session)return viewLogin();
  if(r==='empresas')return shell('empresas',viewEmpresas());
  if(r==='nova')return viewNova(a);
  if(r==='precos')return shell('precos',viewPrecos());
  if(r==='prompt')return shell('prompt',viewPrompt(a));
  return shell('dash',viewDash());
}

function bindNova(){
  renderItens();renderResumo();
  const main=$('.main');
  main.addEventListener('input',e=>{
    const t=e.target,p=draft;
    if(t.dataset.f!==undefined){const f=p.funcoes[+t.dataset.f];f[t.dataset.k]=t.dataset.k==='qtd'?(+t.value||0):t.value;if(t.dataset.k==='qtd'){syncTreinos(p);renderItens()}renderResumo()}
    else if(t.dataset.iq){p.itens[t.dataset.iq].qtd=+t.value||0;renderResumo()}
    else if(t.dataset.c){const k=t.dataset.c;p[k]=k==='esocial'?t.value==='1':(['desconto','validade'].includes(k)?(+t.value||0):t.value);renderResumo()}
  });
  main.addEventListener('change',e=>{if(e.target.dataset.c==='esocial'){draft.esocial=e.target.value==='1';renderResumo()}});
  main.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');if(!t)return;const p=draft,a=t.dataset.act,i=+t.dataset.i;
    if(a==='risk'){const f=p.funcoes[i],r=RISCOS.find(x=>x.id===t.dataset.r);
      if(f.riscos.includes(r.id))f.riscos=f.riscos.filter(x=>x!==r.id);
      else{f.riscos.push(r.id);r.exames.forEach(x=>{if(!f.exames.includes(x))f.exames.push(x)});if(r.treino)p.itens[r.treino].on=true}
      syncTreinos(p);renderNova(getEmp(p.empresaId))}
    else if(a==='exam'){const f=p.funcoes[i],x=t.dataset.e;f.exames=f.exames.includes(x)?f.exames.filter(y=>y!==x):[...f.exames,x];t.classList.toggle('on');renderResumo()}
    else if(a==='addf'){p.funcoes.push({nome:'',qtd:1,riscos:[],exames:['clinico']});renderNova(getEmp(p.empresaId))}
    else if(a==='delf'){p.funcoes.splice(i,1);if(!p.funcoes.length)p.funcoes.push({nome:'',qtd:1,riscos:[],exames:['clinico']});syncTreinos(p);renderNova(getEmp(p.empresaId))}
    else if(a==='item'){p.itens[t.dataset.s].on=t.checked;renderResumo()}
    else if(a==='preview'||a==='gerar'){
      if(!p.funcoes.some(f=>f.nome&&f.qtd))return toast('Preencha ao menos uma função com nome e quantidade');
      p.funcoes=p.funcoes.filter(f=>f.nome&&f.qtd);
      if(a==='preview'){p.preview=true;const tmp={...p};db._preview=tmp;save();window.open('#/p/_preview','_blank');return}
      db.contador++;p.num='2026-'+db.contador;p.criada=hoje();p.status='criada';delete p.preview;
      db.propostas.push(p);save();const link=linkProp(p);draft=null;
      const e=getEmp(p.empresaId);
      const wa=`https://wa.me/55${onlyDigits(e.telefone)}?text=${encodeURIComponent(`Olá, ${(e.contato||'').split(' ')[0]}! Tudo bem? Aqui é da ASO. Preparamos uma proposta personalizada para a ${e.fantasia||e.razao}:\n\n${link}\n\nQualquer dúvida, estou à disposição.`)}`;
      $('#resumo').innerHTML=`<h3>✓ Proposta ${p.num} gerada</h3><p class="muted">Envie o link para ${esc(e.contato)}. Você vai ver aqui quando ele abrir e aprovar.</p>
        <div class="linkbox"><input readonly value="${link}"><button class="btn sm light" id="cp">Copiar</button></div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px"><a class="btn green" style="justify-content:center" target="_blank" href="${wa}">Enviar no WhatsApp</a>
        <a class="btn light" style="justify-content:center" target="_blank" href="#/p/${p.id}">Abrir proposta</a><a class="btn light" style="justify-content:center" href="#/dash">Ir para propostas</a></div>`;
      $('#cp').onclick=()=>{navigator.clipboard?.writeText(link);toast('Link copiado')};
      document.querySelectorAll('.main input,.main textarea,.main select,.main [data-act]').forEach(el=>{if(!el.closest('#resumo')){el.disabled=true;el.style.pointerEvents='none';el.style.opacity=.6}});
    }
  });
}

    <div class="cta"><div><h2>${aprovada?'Proposta aprovada ✓':'Vamos começar?'}</h2><p>${aprovada?'Você vai receber o contrato para assinatura digital em breve.':'Clique em aprovar: a ASO recebe na hora os itens que você escolheu e agenda a visita técnica.'}</p></div>

  const upd=()=>{const c=calc(p,sel);
    $('#kT').textContent=brl(c.total).replace(',00','');$('#pT').textContent=brl(c.total);

    ${c.desc?`<div class="sum-line"><span>Desconto especial (${p.desconto}%)</span><b style="color:#137a48">− ${brl(c.desc)}</b></div>`:''}
    <div class="sum-line total"><span>Total da implantação</span><span>${brl(c.total)}</span></div>`;return c};
  upd();
  $('#its').addEventListener('change',ev=>{const l=ev.target.closest('.item');sel[l.dataset.s].on=ev.target.checked;l.classList.toggle('on',ev.target.checked);upd()});
  const apv=$('#apv');
  if(apv)apv.onclick=()=>{
    if(id==='_preview')return toast('Isto é só uma pré-visualização');

    window.open('https://wa.me/'+db.config.whats+'?text='+encodeURIComponent(msg),'_blank');
    viewProposta(id);
  };
}

/* ================= CONTRATO (PDF) ================= */
function extenso(n){ // por extenso simplificado para valores em reais
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=x=>{if(x===0)return'';if(x===100)return'cem';const p=[];const C=Math.floor(x/100),r=x%100;if(C)p.push(c[C]);if(r<20){if(r)p.push(u[r])}else{p.push(d[Math.floor(r/10)]+(r%10?' e '+u[r%10]:''))}return p.join(' e ')};
  const inteiro=Math.floor(n),cent=Math.round((n-inteiro)*100);
  const mil=Math.floor(inteiro/1000),resto=inteiro%1000;let s='';
  if(mil)s+=(mil===1?'mil':ate999(mil)+' mil');
  if(resto)s+=(mil?(resto<100||resto%100===0?' e ':' '):'')+ate999(resto);
  s=(s||'zero')+(inteiro===1?' real':' reais');
  if(cent)s+=' e '+ate999(cent)+(cent===1?' centavo':' centavos');
  return s;
}

    <p>As partes acima qualificadas celebram o presente contrato, que se regerá pelas cláusulas a seguir.</p>

    <table><thead><tr><th>Serviço</th><th class="num">Qtd.</th><th class="num">Valor</th></tr></thead><tbody>

    <h4>Cláusula 2ª · Do valor e da forma de pagamento</h4>
    <p>Pelos serviços de implantação, a CONTRATANTE pagará o valor total de <b>${brl(c.total)}</b> (${extenso(c.total)}), nas seguintes condições: ${esc(p.pagamento)}.</p>
    <p>O atraso no pagamento sujeitará a CONTRATANTE a multa de 2% e juros de 1% ao mês sobre o valor devido.</p>

}
